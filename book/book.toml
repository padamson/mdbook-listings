[book]
authors = ["Paul Adamson"]
language = "en"
src = "src"
title = "mdbook-listings"
description = "Managed code listings for mdbook: inline callouts, freezing, and verification"

[build]
# Render HTML + typst-pdf under `book/build/` (rather than mdbook's default
# `book/book/`, which reads awkwardly next to the `book/` repo directory).
build-dir = "build"

# Renders admonish note blocks (used in PDF output for inline callouts, and
# throughout the prose). Requires `cargo install mdbook-admonish`.
[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.listings]
command = "mdbook-listings"
# `before = ["links"]` is REQUIRED for the include splicer to see raw
# `{{#include listings/...}}` directives. Without it, mdbook's built-in
# `links` preprocessor expands those includes to file bytes before
# mdbook-listings runs, and the include splicer silently no-ops (no
# directives to find → no `<div data-listing-tag>` anchors emitted).
before = ["admonish", "links"]
# Dogfood the v0.1.1 numbering feature: every listing gets a "Listing N.M"
# label and callout badges scope to it (5.3.1). The prose and the captured
# screenshots predate this and still describe bare ordinals; see the
# "Reading this book" page.
number-listings = true
# Dogfood the List-of-Listings index: the `{{#list-of-listings}}` marker on
# the back-matter page collects every numbered listing book-wide into a linked
# index. Post-v0.1.0; see the "Reading this book" page.
list-of-listings = true
# Dogfood the sidebar variant: "nested" injects each listing into mdbook's
# nav tree, under the chapter it belongs to (built client-side from an inline
# manifest). "append" is the theme-independent fallback rung. Post-v0.1.0;
# see the "Reading this book" page.
list-of-listings-sidebar = "nested"
# Dogfood the provenance line: each listing names the `source` path from
# listings.toml, then its tag as a pill, on a muted line under the caption. This book is the
# case the feature was filed for -- it freezes ../src/main.rs sixteen times
# and ../tests/e2e_callouts.rs twelve, so until now nothing on the page said
# which file, or which iteration of it, a reader was looking at. Post-v0.1.0;
# see the "Reading this book" page.
show-listing-provenance = true

[output.html]
additional-css = ["./mdbook-admonish.css", "./mdbook-listings.css"]
additional-js = ["./mdbook-listings.js"]

# The errata page was renamed when it stopped being a second changelog. The
# old URL is public and linked from elsewhere, so it keeps resolving.
[output.html.redirect]
"/changes-since-0.1.0.html" = "reading-this-book.html"

# Requires `cargo install mdbook-typst-pdf`. `pdf = true` makes it actually
# compile to PDF; without it, the renderer is a no-op (it only emits a `.typ`
# source file at most). `custom-template` swaps out mdbook-typst-pdf's
# default template (which references Noto fonts that aren't installed in CI
# or on the author's local box, producing font-substitution warnings and
# ugly fallbacks) for one that uses fonts we actually install.
[output.typst-pdf]
pdf = true
custom-template = "template.typ"
