# Pre-commit hooks for Rust projects
# Install: cargo install prek && prek install
# Run manually: prek run

fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: mixed-line-ending
        name: Fix mixed line endings

  - repo: https://github.com/crate-ci/typos
    rev: v1.26.8
    hooks:
      - id: typos
        name: Check for typos
        # Frozen listings under book/src/listings/ are byte-exact
        # snapshots; a linter must never rewrite them (it silently breaks
        # the recorded sha256, which `mdbook-listings verify` then flags).
        # They are checked by verify, not typos.
        exclude: '^book/src/listings/'

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Auto-format Rust code
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy linter
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check Rust code compiles
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest run
        description: Run tests with nextest
        # The same filterset as CI's test job: the browser and PDF binaries
        # need a built book and a Chromium, and run on the dedicated e2e job.
        entry: cargo nextest run --workspace -E 'not binary(e2e_callouts) and not binary(pdf_callouts)'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-doctest
        name: cargo test --doc
        description: Run documentation tests
        entry: cargo test --doc --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # cargo deny covers advisories too (it reads the RustSec database),
      # so there is no separate `cargo audit` hook and only one ignore
      # list, in `deny.toml`. Advisories go through cargo-lockpatrol, the
      # hook at the end of this file, the same checker as the CI gate and
      # the monitor, which reads every tracked Cargo.lock.
      # Both are diff-gated on purpose (cargo-lockpatrol's `files:` comes
      # from its own .pre-commit-hooks.yaml): an advisory published
      # overnight should not block an unrelated commit; the scheduled
      # advisory-monitor workflow catches those.
      - id: cargo-deny
        name: cargo deny
        description: Check licenses, bans, and source restrictions
        entry: cargo deny --workspace check bans licenses sources
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock|deny\.toml)$

      - id: cargo-vet
        name: cargo vet
        description: Verify dependency supply chain audits
        entry: cargo vet
        language: system
        pass_filenames: false
        files: (Cargo\.toml|Cargo\.lock|supply-chain/)$

      - id: mdbook-listings-verify
        name: mdbook-listings verify
        description: Frozen snapshots intact, references resolve, no dangling sidecars
        entry: cargo run --quiet -- verify --book-root book
        language: system
        pass_filenames: false
        files: ^book/

      - id: skill-version-bumped
        name: skill version bumped
        description: Skill edits must bump metadata.version, the only version a consumer can compare
        entry: ./scripts/check-skill-version-bumped.sh
        language: system
        pass_filenames: false
        files: ^skills/

  # Builds the binary at the pinned rev (prek runs `cargo install`), so
  # the hook is the release the CI gate and the monitor run. Needs
  # cargo-deny on PATH. Dependabot's pre-commit entry moves this rev.
  - repo: https://github.com/padamson/cargo-lockpatrol
    rev: e791845e4a03af540c2348755c3695041cdd54fd  # frozen: v0.2.0
    hooks:
      - id: cargo-lockpatrol
