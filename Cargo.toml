[package]
name = "mdbook-listings"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Managed code listings for mdbook: inline callouts, freezing, and verification"
repository = "https://github.com/padamson/mdbook-listings"
categories = ["command-line-utilities", "text-processing"]
keywords = ["mdbook", "preprocessor", "documentation", "code-listing"]
exclude = ["book/", ".claude-plugin/", "skills/", ".claude/", "examples/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mdbook-preprocessor = "0.5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
toml = "1.1"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2"
futures = "0.3"
# Fork carries the per-page font-cache fix (upstream jrmuizel/pdf-extract#152,
# unmerged); 0.12.0 garbles multi-page typst extraction and 0.10 pulls the
# lopdf with RUSTSEC-2026-0187. Swap back to crates.io when a release ships
# with the fix. Tracked in #31.
pdf-extract = { git = "https://github.com/padamson/pdf-extract", branch = "fix/per-page-font-cache" }
playwright-rs = { workspace = true }
playwright-rs-trace = "0.1.2"
predicates = "3"
tempfile = "3"
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace tools live alongside the crate but are not part of the published
# crate (each carries `publish = false`). Run with `cargo run -p <name>`.
[workspace]
members = ["tools/capture-screenshots"]

# Shared by the crate and the capture-screenshots workspace tool.
# Tracks crates.io releases rather than playwright-rust's `main`: a branch
# dependency re-resolves on every upstream commit, so dependabot opened a PR
# per commit (two at a time, since the trace crate moves with it) and the
# lockfile churned for changes no test here exercised. Releases still
# dogfood the fork — we cut them. Browser install follows the crate; see
# examples/install-browsers.rs.
[workspace.dependencies]
playwright-rs = "0.15.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
