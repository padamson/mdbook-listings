version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Wait before proposing a bump so it isn't opened the instant a crate
    # publishes. This repo runs cargo-vet: a hours-old version has not been
    # audited by the imported vet sets yet, so an immediate bump is
    # structurally guaranteed to fail the supply-chain gate and get waved
    # through with an unaudited exemption. A cooldown lets the upstream
    # audits land first, so most bumps vet clean with no exemption at all.
    # Majors wait longest (riskiest); patches shortest (often security fixes).
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pdf-extract 0.12 pulls the patched lopdf (>=0.42) but garbles
      # typst text extraction, breaking tests/pdf_callouts.rs. Hold at
      # 0.10 and drop this ignore once the regression is fixed upstream.
      # Tracked in #31.
      - dependency-name: "pdf-extract"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Same cooldown for actions: skip same-day releases that get yanked and
    # let advisories surface before adopting a version.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
