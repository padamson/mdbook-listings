version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Wait before proposing a bump so it isn't opened the instant a crate
    # publishes. This repo runs cargo-vet: a hours-old version has not been
    # audited by the imported vet sets yet, so an immediate bump is
    # structurally guaranteed to fail the supply-chain gate and get waved
    # through with an unaudited exemption. A cooldown lets the upstream
    # audits land first, so most bumps vet clean with no exemption at all.
    # Majors wait longest (riskiest); patches shortest (often security fixes).
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      # Our own crates are exempt: the cooldown exists to let upstream vet
      # audits land first, and our supply-chain already trusts these the
      # moment they publish (trusted-publisher entries in
      # supply-chain/audits.toml). Waiting would only delay dogfooding our
      # own releases. Pattern rather than names so future siblings from
      # the playwright-rust workspace inherit the exemption.
      exclude:
        - "playwright-rs*"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Same idea for actions: skip same-day releases that get yanked and let
    # advisories surface first. Dependabot only supports `default-days` for
    # the github-actions ecosystem (the per-semver keys are cargo-only).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # The cargo-lockpatrol hook rev in .pre-commit-config.yaml. Its action
  # pin moves in the github-actions group above, so the commit hook and the
  # CI gate can sit a release apart until both PRs merge. The auto-merge
  # workflow merges this PR like every other, and nothing in CI runs the
  # hooks, so the next local commit runs the new rev unreviewed: that is
  # accepted for cargo-lockpatrol, one of our own crates, as it is for its
  # action pin. `allow` keeps the third-party hooks (pre-commit-hooks, typos) to
  # hand bumps for the same reason. Only default-days, as for
  # github-actions.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # pre-commit dependency names are full repo URLs, hence the wildcards.
    allow:
      - dependency-name: "*padamson/cargo-lockpatrol*"
