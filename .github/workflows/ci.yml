name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Read-only by default; every job that needs to write says so itself.
# Without this, the MSRV, test and e2e jobs -- which run third-party build
# scripts and a browser -- hold a token that can push to the repo, move a
# release and mint attestations.
permissions:
  contents: read

# Cancel in-progress runs on the same PR; let main and tag runs queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    # The prek hook of the same name is per-clone and opt-in, so a hookless
    # clone or a `--no-verify` commit would ship a skill edit without the
    # version bump installed consumers key their updates on. Same script,
    # run against the PR base or the tip before the push. Tag pushes and
    # manual runs re-check a commit the main push already checked, so skip.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      - name: Check the skill version against the base
        run: scripts/check-skill-version-bumped.sh --base "${{ steps.base.outputs.ref }}"

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv-1.88

      - name: Check compilation on MSRV
        run: cargo check --workspace

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      # Browser-based e2e_callouts and pdf_callouts tests are excluded here;
      # they need a built book (and Playwright / typst-pdf fonts) and run
      # on the dedicated Linux `e2e` job.
      - name: Run tests
        run: cargo nextest run --workspace -E 'not binary(e2e_callouts) and not binary(pdf_callouts)'

      - name: Run doc-tests
        if: hashFiles('**/src/lib.rs') != ''
        run: cargo test --doc --workspace

      - name: Generate documentation
        run: cargo doc --no-deps --workspace

  e2e:
    name: Browser-based E2E + book build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install fonts (for Typst PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-sil-charis fonts-inter fonts-jetbrains-mono

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Each bump rebuilds the playwright-rs test binary from scratch so
          # build.rs reruns and rebakes PLAYWRIGHT_DRIVER_DIR for the
          # current runner image. Earlier bumps (v2→v3) were triggered by
          # rustc-toolchain bumps on the GitHub-hosted runner; v4 bumps
          # again because the driver path baked in v3's cache no longer
          # matches the current runner's `drivers/` layout (slice 7 e2e
          # tests fail with `ServerNotFound`).
          shared-key: e2e-v4

      # Cache the Playwright browser binaries (~/.cache/ms-playwright/) and
      # the playwright-rs driver (drivers/ at workspace root). The driver is
      # downloaded once by playwright-rs's build.rs and its absolute path is
      # baked into the compiled test binary via cargo:rustc-env — Swatinem
      # caches target/ and so the binary stays valid across runs, but the
      # driver lives OUTSIDE target/ so it needs its own cache key.
      - name: Cache Playwright browsers + driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ms-playwright/
            drivers/
          key: ${{ runner.os }}-playwright-${{ hashFiles('Cargo.lock', '.github/workflows/ci.yml', 'examples/install-browsers.rs') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install mdbook (prebuilt)
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: mdbook

      - name: Resolve mdbook-typst-pdf fork SHA
        # SHA-pin the install so a transient upstream regression on the
        # fork branch surfaces on the SAME commit it landed on, not
        # whenever the runner's cargo cache happens to miss.
        id: typst-pdf-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api repos/padamson/mdbook-typst-pdf/commits/fix/dynamic-fence-length --jq .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Install mdbook-typst-pdf (padamson fork — dynamic fence-length fix)
        # Stock mdbook-typst-pdf uses a fixed 4-backtick wrapper fence
        # that breaks on diff content containing 4-backtick string
        # literals. The fork branch scans body content for the longest
        # backtick run and uses ≥max+1 backticks for the wrapper.
        # Pinned here until the upstream PR merges + a new release ships.
        # --force always overwrites the cached binary (no `command -v`
        # short-circuit, which would let a stock-release binary from a
        # prior run silently shadow the fork install). --locked uses
        # the fork's Cargo.lock so transitive resolution doesn't drift
        # across runs (otherwise crates.io updates between runs can
        # pick versions that won't compile on the runner's Rust).
        run: cargo install --git https://github.com/padamson/mdbook-typst-pdf --rev ${{ steps.typst-pdf-sha.outputs.sha }} --locked --force

      - name: Resolve mdbook-admonish fork SHA
        id: admonish-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api repos/padamson/mdbook-admonish/commits/feat/mdbook-0.5-compat --jq .sha)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Install mdbook-admonish (padamson fork — mdbook-0.5 compat)
        # Stock mdbook-admonish on crates.io isn't mdbook-0.5 compatible
        # yet; tracking upstream PR tommilligan/mdbook-admonish#235.
        # SHA-pinned + --locked same as the typst-pdf install above.
        run: cargo install --git https://github.com/padamson/mdbook-admonish --rev ${{ steps.admonish-sha.outputs.sha }} --locked --force

      - name: Refresh mdbook-admonish assets
        working-directory: book
        run: mdbook-admonish install

      - name: Install mdbook-listings (local crate, used as preprocessor)
        run: cargo install --path . --locked --force

      - name: Verify frozen listings
        # Dogfood: the book is verify's first production user. Fails the
        # build if a frozen snapshot drifted from its recorded sha256, a
        # listing reference doesn't resolve, or a sidecar is dangling.
        run: mdbook-listings verify --book-root book

      - name: Build book (HTML + PDF)
        run: mdbook build book/

      - name: Install Chromium for the bundled Playwright driver
        # No Playwright version and no Node setup here on purpose — the
        # browser revision follows the crate and the driver ships its own
        # Node. Rationale lives in examples/install-browsers.rs; do not
        # reintroduce a version pin in this step.
        run: cargo run --example install-browsers

      - name: Run browser-based E2E tests
        run: cargo test --test e2e_callouts

      - name: Run PDF content tests
        # Asserts the typst-pdf renderer's callout output. Requires the
        # PDF that the previous `mdbook build` step produced. The test is
        # `#[ignore]`d locally (~20s extracting the full book PDF) and
        # explicitly opted into here.
        run: cargo test --test pdf_callouts -- --ignored

      - name: Bundle PDF into the HTML site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          PDF=$(find book/build/typst-pdf -maxdepth 1 -type f -name '*.pdf' | head -n1)
          if [ -n "${PDF}" ]; then
            cp "${PDF}" book/build/html/mdbook-listings.pdf
          else
            echo "No PDF found under book/build/typst-pdf — skipping bundle." >&2
          fi

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: book/build/html

  deploy-book:
    name: Deploy book to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Allow one concurrent deployment, queued; don't cancel in-progress runs.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The release is three jobs, not one. This job only builds: each matrix
  # leg hands its archive to `release-assets` as a workflow artifact and
  # never touches the GitHub Release or crates.io. That is what lets a
  # flaky upload fail on its own without withholding the crate (#63), and
  # what makes `gh run rerun --failed` re-upload without rebuilding. The
  # trade: one failed leg now means no release page at all until the rerun,
  # where the per-leg uploads used to leave a page with three of four
  # archives. A complete page after a rerun beats a partial one now.
  build-release:
    name: Build release ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write       # provenance attestation
      attestations: write
    needs: e2e
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # Build only the published crate's binary. `--bin mdbook-listings`
      # excludes the `capture-screenshots` workspace tool (publish = false),
      # which pulls in playwright-rs and doesn't cross-compile in the
      # release matrix. No `continue-on-error`: a build failure must fail
      # the release, not silently produce an empty GitHub Release.
      - name: Build release binary
        run: cargo build --release --bin mdbook-listings --target ${{ matrix.target }} --verbose

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        # Best-effort: cross-target strip can no-op on a foreign-arch binary.
        run: strip "target/${{ matrix.target }}/release/mdbook-listings" || true

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: tar czf "mdbook-listings-v${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" mdbook-listings

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a "mdbook-listings-v${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/mdbook-listings.exe"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            *.tar.gz
            *.zip
        continue-on-error: true

      - name: Hand the archive to release-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 7

  # Attaches the four archives to the GitHub Release. Runs beside
  # `publish-crates`, not ahead of it: the v0.2.1 cut lost its crate to an
  # `other side closed` here, on a tarball crates.io never needed. Uploads
  # retry because that failure was transient (a rerun with no code change
  # fixed it). Failure here still reddens the run -- it should, the release
  # page is incomplete -- but it no longer decides anything else.
  release-assets:
    name: Upload release assets
    permissions:
      contents: write       # create the GitHub Release and attach files
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install parse-changelog
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: parse-changelog

      - name: Collect the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          parse-changelog CHANGELOG.md "${TAG#v}" > release_notes.md

          # download-artifact matching nothing is not an error to it. It is
          # to us: expired artifacts (7-day retention) or a rerun whose
          # rebuild produced none must not spin the retry loop on a literal
          # `dist/*` and report an upload fault.
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no archives to upload; the build artifacts are missing or expired"
            exit 1
          fi
          ls -l dist

          # A rerun and a torn earlier attempt both arrive with the release
          # already present. Refresh its notes rather than skip, so a
          # CHANGELOG fix reaches the page. stderr stays visible so a
          # transient API error reads as one, not as "release absent".
          if gh release view "$TAG" >/dev/null; then
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release_notes.md
          fi

          # Retry per file with backoff, so only the flaky asset is retried
          # and the ones already attached are never touched. Each failed
          # attempt logs why, so a persistent fault is read from the log,
          # not inferred from the count. `--clobber` replaces whatever a
          # torn attempt left behind.
          for f in "${files[@]}"; do
            attempt=1
            until gh release upload "$TAG" "$f" --clobber; do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::upload of $f failed after $attempt attempts"
                exit 1
              fi
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          done

  publish-crates:
    name: Publish to crates.io
    permissions:
      contents: read
    # Gates on the binaries building, not on their reaching the release
    # page -- crates.io consumers never see the tarballs. `always()` so a
    # failed build leg fails this job by name instead of leaving it
    # `skipped`, which the run summary reads as "not applicable" (#63).
    needs: build-release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require the release binaries to have built
        env:
          RESULT: ${{ needs.build-release.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::release binaries did not build ($RESULT); crate not published"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install parse-changelog
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: parse-changelog

      # The CHANGELOG entry used to be checked as a side effect of writing
      # release notes in the build job, which this job waited on. It is a
      # precondition of publishing, not of uploading: a tag whose version
      # CHANGELOG.md does not know is a mistake, and `cargo publish` cannot
      # be undone.
      - name: Require a CHANGELOG entry for this version
        env:
          TAG: ${{ github.ref_name }}
        run: parse-changelog CHANGELOG.md "${TAG#v}" >/dev/null

      # No soft guard and no continue-on-error, deliberately. Both were here
      # and both turned a release that published nothing into a green run:
      # a missing secret skipped the step and reported success, and a failed
      # `cargo publish` was swallowed. A tag that does not reach crates.io
      # must fail loudly -- consumers pin the registry version, so a silent
      # skip is indistinguishable from a release to everyone downstream.
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
