name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Arm GitHub's auto-merge on every dependabot PR. This is safe because
    # the main ruleset requires the full gate — tests on three platforms,
    # MSRV, e2e + book build, audit, deny, cargo vet, and mutation diff —
    # so the PR only merges if every gate is green. A bump nobody has
    # vouched for fails Supply Chain Review, never merges, and falls
    # through to the manual flow: audit the delta locally, land the bump
    # on main, and dependabot closes the PR itself.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        # GITHUB_TOKEN attribution means the eventual merge push does not
        # trigger the push-event workflows on main (Pages deploy, the
        # Security & Quality push run). The PR ran the identical checks,
        # the book only changes through real commits, and the weekly
        # scheduled security run covers advisory drift — so nothing is
        # lost. Swap in a fine-grained PAT secret here if main-push runs
        # on dependabot merges ever become wanted.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
