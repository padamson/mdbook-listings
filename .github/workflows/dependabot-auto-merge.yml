name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    # Arm GitHub's auto-merge on every Dependabot PR. This is safe because
    # the main ruleset requires the full gate (tests on three platforms,
    # MSRV, e2e + book build, audit, deny, cargo vet, and mutation diff),
    # so the PR only merges if every gate is green. A bump nobody has
    # vouched for fails Supply Chain Review, never merges, and falls
    # through to the manual flow: audit the delta locally, land the bump
    # on main, and Dependabot closes the PR itself.
    #
    # The merge is made with a GitHub App token, not GITHUB_TOKEN. A merge
    # made with GITHUB_TOKEN triggers no workflows, so main would get no
    # push run: no Pages deploy of the book and no Security & Quality run
    # on the merged commit. The App's merge triggers them like any other
    # push.
    #
    # The App needs Contents, Pull requests and Workflows (read and write)
    # on this repo; Workflows because Dependabot's actions bumps edit
    # workflow files. Its Client ID and private key are Dependabot secrets,
    # the only secrets a Dependabot-triggered run can read. It must not be
    # on the ruleset's bypass list, or its merges would skip the required
    # checks.
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only Dependabot's own PRs: Dependabot opened the PR (the actor alone
    # is whoever acted last) and made this push. A human push to a
    # Dependabot branch skips the job instead of failing at the mint step.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    steps:
      - name: Mint a token for the merge App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
