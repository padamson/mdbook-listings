name: Security & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Saturday 5am ET
    - cron: '0 9 * * 6'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      # Unpinned on purpose: an older cargo-audit can fail to parse newer
      # advisory-db entries (CVSS 4.0, 2025), and a pinned copy waits on a
      # Dependabot bump to recover. `--locked` builds against its own lock.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit

  deny:
    name: License & Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny
        run: cargo deny --workspace check bans licenses sources

      # Advisories go through the script advisory-monitor.yml runs daily,
      # so the gate and the monitor read the same lockfiles and agree on
      # what counts as a finding. The self-test pins its classifier to
      # cargo-deny's output format.
      - name: Verify the advisory checker classifies cargo-deny output
        run: scripts/test-check-advisories.sh

      - name: Check advisories in every lockfile
        run: scripts/check-advisories.sh

  supply-chain:
    name: Supply Chain Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      # Built from crates.io on purpose: install-action serves GitHub release
      # binaries, and cargo-vet's newest release with binaries is 0.10.0,
      # which cannot parse the `trusted-publisher` entries that 0.10.2
      # (crates.io) writes. `--locked` builds against cargo-vet's own
      # Cargo.lock. No version pin on purpose: Dependabot cannot bump a
      # `run:` line, and cargo-vet refuses a store written by a newer
      # version, so a pinned CI copy older than a local one goes red.
      - name: Install cargo-vet
        run: cargo install --locked cargo-vet

      - name: Run cargo vet
        run: |
          if [ -f supply-chain/audits.toml ]; then
            # `--locked` reads imports.lock instead of fetching the
            # imported audits, so a commit that left an import out fails.
            cargo vet --locked
          else
            echo "supply-chain/ not initialized; skipping. Run 'cargo vet init' to enable."
          fi

  mutation-testing:
    name: Mutation Testing (full)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # The weekly backstop for code no push touched. Per-push verification
    # is `mutation-testing-diff` below, scoped to the lines a push or PR
    # changed, which cannot see a test that stopped killing a mutant in
    # code it did not touch. The full run grows with the codebase; the
    # job timeout above is the budget, and hitting it is a finding.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest

      # Use prebuilt binary via taiki-e/install-action. `cargo install
      # cargo-mutants` fails when the cargo cache restores a previously
      # installed binary into `~/.cargo/bin/` (cargo install refuses to
      # overwrite without --force); the action handles the
      # already-installed case correctly and is ~10x faster anyway.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-mutants

      # `.cargo/mutants.toml` scopes the run: nextest, browser/PDF test
      # binaries filtered out, known-equivalent mutants excluded.
      # Exit 3 (timeouts, none missed) passes: a hung mutant is a
      # detection — see the matching logic in scripts/mutants.sh.
      - name: Run mutation testing
        env:
          PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: 1
        run: |
          rc=0
          cargo mutants || rc=$?
          if [ "$rc" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then
            echo "timeouts only — treating as pass"
            rc=0
          fi
          exit $rc

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report
          path: mutants.out/

  mutation-testing-diff:
    name: Mutation Testing (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Fast per-push variant: scopes to the lines touched in this push or
    # pull request via `cargo mutants --in-diff`. Typical runtime is
    # seconds-to-minutes rather than the full-codebase job's hours.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need history beyond HEAD so `git diff` can reach the base
          # commit (push: `before` SHA; PR: merge base of base ref).
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-diff-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-diff-
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest

      - name: Install cargo-mutants
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-mutants

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      - name: Run mutation testing on diff
        # No browser, book, or fork setup here: .cargo/mutants.toml
        # filters out the e2e/PDF test binaries, so mutant runs never
        # launch a browser, and PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD keeps
        # playwright-rs's build script from fetching a driver this job
        # would never use.
        env:
          PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: 1
        run: ./scripts/mutants.sh ${{ steps.base.outputs.ref }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-diff
          path: mutants.out/
