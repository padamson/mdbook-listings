name: Security & Quality

# The jobs are shared workflows in padamson/rust-ci-workflows. Each check
# reports as `<job id here> / <job name there>`, the names the `main`
# ruleset requires. The local half of each gate stays here: `deny.toml`,
# `supply-chain/`, `.cargo/mutants.toml`, `.config/nextest.toml`, and the
# prek hooks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Saturday 5am ET
    - cron: '0 9 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: padamson/rust-ci-workflows/.github/workflows/supply-chain.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0

  semver-preview:
    uses: padamson/rust-ci-workflows/.github/workflows/semver-preview.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0

  # The weekly schedule runs the full sweep (about two hours unsharded).
  # `.cargo/mutants.toml` filters out the browser and PDF test binaries, so
  # no mutant launches a browser, and the variable below keeps
  # playwright-rs's build script from fetching a driver nothing here uses.
  mutation:
    uses: padamson/rust-ci-workflows/.github/workflows/mutation.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
    with:
      setup: echo "PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD=1" >> "$GITHUB_ENV"
